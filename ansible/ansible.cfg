[defaults]
# Desativa avisos de depreciação na consola
deprecation_warnings = False

# Fixa o interpretador Python para evitar o aviso de auto-discovery
interpreter_python = auto_silent

# Define a localização padrão do inventário
inventory = inventory

# Localização da chave mestra
vault_password_file = ../.vault_pass

# Melhora a legibilidade do output das tarefas
stdout_callback = default

result_format = yaml