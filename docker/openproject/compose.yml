networks:
  frontend:
  backend:

volumes:
  opdata:

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:${TAG:-15-slim}
x-op-app: &app
  <<: [*image, *restart_policy]
  environment:
    OPENPROJECT_HTTPS: "true"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-192.168.56.10}"
    OPENPROJECT_HSTS: "true"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Defina SECRET_KEY_BASE no .env}"
    RAILS_CACHE_STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    DATABASE_URL: "${DATABASE_URL:?Defina DATABASE_URL no .env}"
    RAILS_MIN_THREADS: 2
    RAILS_MAX_THREADS: 8
    WEB_CONCURRENCY: 2
    IMAP_ENABLED: "false"
  volumes:
    - "opdata:/var/openproject/assets"

services:
  cache:
    image: memcached
    <<: *restart_policy
    networks:
      - backend

  proxy:
    build:
      context: ./proxy
      args:
        APP_HOST: web
    image: openproject/proxy
    <<: *restart_policy
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - web
    networks:
      - frontend

  web:
    <<: *app
    command: "./docker/prod/web"
    networks:
      - frontend
      - backend
    depends_on:
      - cache
      - seeder
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_checks/default"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    command: "./docker/prod/worker"
    networks:
      - backend
    depends_on:
      - cache
      - seeder

  cron:
    <<: *app
    command: "./docker/prod/cron"
    networks:
      - backend
    depends_on:
      - cache
      - seeder

  seeder:
    <<: *app
    command: "./docker/prod/seeder"
    restart: on-failure
    networks:
      - backend
